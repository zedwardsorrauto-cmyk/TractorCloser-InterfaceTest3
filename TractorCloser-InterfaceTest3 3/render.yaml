services:
  - type: web
    name: tractorcloser-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tractorcloser-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_SALESPERSON_PASSWORD
        sync: false
      - key: SEED_DEVELOPER_PASSWORD
        sync: false

databases:
  - name: tractorcloser-db
    databaseName: tractorcloser
    user: tractorcloser
