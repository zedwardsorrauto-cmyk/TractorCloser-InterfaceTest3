services:
  - type: web
    name: tractorcloser-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tractorcloser-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_SALESPERSON_PASSWORD
        sync: false
      - key: SEED_DEVELOPER_PASSWORD
        sync: false
      - key: APP_ENVIRONMENT
        value: testing
      - key: ALLOWED_ORIGINS
        sync: false
      - key: INTEGRATION_INTAKE_ENABLED
        value: false
      - key: IDEAL_API_BASE_URL
        sync: false
      - key: IDEAL_API_USERNAME
        sync: false
      - key: IDEAL_API_PASSWORD
        sync: false
      - key: IDEAL_COMPANY_ID
        sync: false
      - key: IDEAL_LOCATION_ID
        sync: false
      - key: IDEAL_API_TEST_STOCK_NUMBER
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false

databases:
  - name: tractorcloser-db
    databaseName: tractorcloser
    user: tractorcloser
